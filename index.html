<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光——校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-row">
        <div><h1 id="header-title">拾光</h1><p id="header-subtitle">校园失物招领</p></div>
        <button class="icon-button" id="search-entry" type="button" aria-label="搜索信息">⌕</button>
      </div>
    </header>

    <main class="app-content">
      <section id="home-view" aria-labelledby="welcome-title">
      <section class="hero-card" aria-labelledby="welcome-title">
        <p class="eyebrow">校园互助平台</p>
        <h2 id="welcome-title">让遗失有回应</h2>
        <p>把线索留下，让物品回家。</p>
      </section>
      <section class="items-section" aria-labelledby="items-title">
        <div class="section-heading"><h2 id="items-title" tabindex="-1">校园信息</h2><span id="result-count" class="result-count"></span></div>
        <div class="filter-tabs" role="tablist" aria-label="信息筛选">
          <button id="filter-lost" class="filter-tab active" type="button" role="tab" aria-selected="true" aria-controls="item-list" data-filter="lost">寻物信息</button>
          <button id="filter-found" class="filter-tab" type="button" role="tab" aria-selected="false" aria-controls="item-list" data-filter="found">招领信息</button>
          <button id="filter-latest" class="filter-tab" type="button" role="tab" aria-selected="false" aria-controls="item-list" data-filter="latest">按最新发布</button>
        </div>
        <div id="item-list" class="item-list" role="tabpanel" tabindex="0" aria-live="polite" aria-label="信息列表"></div>
        <p id="interaction-feedback" class="sr-only" aria-live="assertive"></p>
      </section>
      </section>

      <section id="search-view" class="search-view" aria-labelledby="search-title" hidden>
        <div class="search-page-heading">
          <button id="search-back" class="back-button" type="button" aria-label="返回首页">←</button>
          <div><p class="eyebrow">校园互助</p><h2 id="search-title" tabindex="-1">搜索物品</h2></div>
        </div>
        <form id="search-form" class="search-form" role="search" novalidate>
          <label class="sr-only" for="search-keyword">输入物品名称、类别、地点或描述</label>
          <div class="search-input-row">
            <input id="search-keyword" name="keyword" type="search" maxlength="100" autocomplete="off" placeholder="输入物品名称、类别或地点">
            <button id="clear-search" class="clear-search" type="button" aria-label="清空关键词" hidden>×</button>
          </div>
          <button class="primary-button search-submit" type="submit">搜索</button>
          <p id="search-error" class="form-message error-message" role="alert" hidden></p>
        </form>
        <section id="search-suggestions" class="search-suggestions" aria-labelledby="suggestions-title">
          <h3 id="suggestions-title">试试这些关键词</h3>
          <div class="quick-keywords">
            <button class="quick-keyword" type="button" data-keyword="水杯">水杯</button>
            <button class="quick-keyword" type="button" data-keyword="钥匙">钥匙</button>
            <button class="quick-keyword" type="button" data-keyword="笔记本">笔记本</button>
          </div>
        </section>
        <section id="search-results" class="search-results" aria-labelledby="search-results-title" hidden>
          <div class="section-heading search-results-heading">
            <h3 id="search-results-title">搜索结果</h3>
            <span id="search-result-count" class="result-count"></span>
          </div>
          <p id="search-summary" class="search-summary" aria-live="polite"></p>
          <div id="search-result-list" class="item-list" role="list" aria-live="polite" aria-label="搜索结果"></div>
        </section>
        <section id="search-empty" class="search-empty" aria-labelledby="search-empty-title" hidden>
          <div class="search-empty-icon" aria-hidden="true">⌕</div>
          <h3 id="search-empty-title">没有找到相关物品</h3>
          <p id="search-empty-message"></p>
          <div class="empty-actions">
            <button id="no-result-search" class="secondary-button" type="button">重新搜索</button>
            <button id="no-result-publish" class="primary-button" type="button">发布寻物</button>
          </div>
        </section>
        <p id="search-feedback" class="sr-only" aria-live="assertive"></p>
      </section>

      <section id="publish-view" class="publish-view" aria-labelledby="publish-title" hidden>
        <div class="section-heading publish-heading"><div><p class="eyebrow">校园互助</p><h2 id="publish-title" tabindex="-1">发布信息</h2></div></div>
        <div class="mode-switch" role="group" aria-label="选择发布类型">
          <button class="mode-button active" id="mode-lost" type="button" aria-pressed="true" data-mode="lost">发布寻物</button>
          <button class="mode-button" id="mode-found" type="button" aria-pressed="false" data-mode="found">发布招领</button>
        </div>
        <form id="publish-form" class="publish-form" aria-labelledby="publish-title" aria-busy="false" novalidate>
          <div class="form-field">
            <label for="item-name">物品名称 <span class="required-mark">*</span></label>
            <input id="item-name" name="name" type="text" maxlength="50" autocomplete="off" placeholder="例如：蓝色水杯" aria-describedby="item-name-hint item-name-error" required>
            <span id="item-name-hint" class="field-hint">最多 50 个字符</span>
            <span id="item-name-error" class="field-error" hidden></span>
          </div>
          <div class="form-field">
            <label for="item-category">物品类别 <span class="required-mark">*</span></label>
            <select id="item-category" name="category" aria-describedby="item-category-error" required>
              <option value="">请选择物品类别</option>
              <option>校园卡</option><option>水杯</option><option>钥匙</option><option>雨伞</option>
              <option>电子设备</option><option>书籍文具</option><option>其他</option>
            </select>
            <span id="item-category-error" class="field-error" hidden></span>
          </div>
          <div class="form-field">
            <label id="location-label" for="item-location">丢失地点 <span class="required-mark">*</span></label>
            <input id="item-location" name="location" type="text" maxlength="100" autocomplete="off" placeholder="例如：图书馆二楼" aria-describedby="item-location-hint item-location-error" required>
            <span id="item-location-hint" class="field-hint">最多 100 个字符</span>
            <span id="item-location-error" class="field-error" hidden></span>
          </div>
          <div class="form-field">
            <label id="event-time-label" for="event-time">丢失时间 <span class="required-mark">*</span></label>
            <input id="event-time" name="eventAt" type="datetime-local" aria-describedby="event-time-hint event-time-error" required>
            <span id="event-time-hint" class="field-hint">请填写实际丢失或拾取时间，不能晚于当前时间</span>
            <span id="event-time-error" class="field-error" hidden></span>
          </div>
          <div class="form-field">
            <label for="item-description">物品描述 <span class="required-mark">*</span></label>
            <textarea id="item-description" name="description" maxlength="500" rows="4" placeholder="描述物品特征、遗失或拾取经过等（最多500个字符）" aria-describedby="item-description-hint item-description-error" required></textarea>
            <span id="item-description-hint" class="field-hint">最多 500 个字符</span>
            <span id="item-description-error" class="field-error" hidden></span>
          </div>
          <div class="form-field">
            <label for="item-contact">联系方式 <span class="required-mark">*</span></label>
            <input id="item-contact" name="contact" type="text" maxlength="80" autocomplete="off" placeholder="微信号或手机号" aria-describedby="item-contact-hint item-contact-error" required>
            <span id="item-contact-hint" class="field-hint">最多 80 个字符；仅用于校园联系，请确认填写准确</span>
            <span id="item-contact-error" class="field-error" hidden></span>
          </div>
          <p id="form-error" class="form-message error-message" role="alert" tabindex="-1" hidden></p>
          <p id="form-info" class="form-message info-message" role="status" hidden></p>
          <button id="submit-publish" class="primary-button" type="submit">发布信息</button>
        </form>
      </section>

      <section id="success-view" class="success-view" aria-labelledby="success-title" hidden>
        <div class="success-mark" aria-hidden="true">✓</div>
        <p class="eyebrow">信息已保存到当前浏览器</p>
        <h2 id="success-title" tabindex="-1">发布成功</h2>
        <p class="success-item-name" id="success-item-name"></p>
        <div class="success-status-card"><span>当前状态</span><strong id="success-status"></strong></div>
        <p id="success-action-feedback" class="form-message info-message" role="status" hidden></p>
        <div class="success-actions">
          <button id="view-details" class="secondary-button" type="button">查看详情</button>
          <button id="continue-publishing" class="primary-button" type="button">继续发布</button>
          <button id="return-home" class="text-button" type="button">返回首页</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a class="nav-item active" href="#home" data-page="home" aria-current="page">
        <span aria-hidden="true">⌂</span>
        <span>首页</span>
      </a>
      <a class="nav-item" href="#publish" data-page="publish" aria-label="发布信息">
        <span aria-hidden="true">＋</span>
        <span>发布</span>
      </a>
      <a class="nav-item" href="#my-posts" data-page="my-posts" aria-label="我的发布（后续开发）">
        <span aria-hidden="true">♡</span>
        <span>我的发布</span>
      </a>
    </nav>
  </div>

  <script src="js/logic.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
