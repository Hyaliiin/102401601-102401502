<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光——校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-row">
        <div><h1>拾光</h1><p>校园失物招领</p></div>
        <button class="icon-button" id="search-entry" type="button" aria-label="搜索信息">⌕</button>
      </div>
    </header>

    <main class="app-content">
      <section class="hero-card" aria-labelledby="welcome-title">
        <p class="eyebrow">校园互助平台</p>
        <h2 id="welcome-title">让遗失有回应</h2>
        <p>把线索留下，让物品回家。</p>
      </section>
      <section class="items-section" aria-labelledby="items-title">
        <div class="section-heading"><h2 id="items-title">校园信息</h2><span id="result-count" class="result-count"></span></div>
        <div class="filter-tabs" role="tablist" aria-label="信息筛选">
          <button class="filter-tab active" type="button" role="tab" aria-selected="true" data-filter="lost">寻物信息</button>
          <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="found">招领信息</button>
          <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="latest">按最新发布</button>
        </div>
        <div id="item-list" class="item-list" aria-live="polite"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a class="nav-item active" href="index.html" aria-current="page">
        <span aria-hidden="true">⌂</span>
        <span>首页</span>
      </a>
      <a class="nav-item" href="#publish" aria-label="发布（后续开发）">
        <span aria-hidden="true">＋</span>
        <span>发布</span>
      </a>
      <a class="nav-item" href="#my-posts" aria-label="我的发布（后续开发）">
        <span aria-hidden="true">♡</span>
        <span>我的发布</span>
      </a>
    </nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
